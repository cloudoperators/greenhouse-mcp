# REUSE-IgnoreStart
header:
  license:
    spdx-id: Apache-2.0
    content: |
      SPDX-FileCopyrightText: [year] SAP SE or an SAP affiliate company and Greenhouse contributors
      SPDX-License-Identifier: Apache-2.0
    pattern: |
      SPDX-FileCopyrightText: [0-9]+ SAP SE or an SAP affiliate company and Greenhouse contributors
      SPDX-License-Identifier: Apache-2\.0
  # REUSE-IgnoreEnd

  paths: # `paths` are the path list that will be checked (and fixed) by license-eye, default is ['**'].
    - '**'

  paths-ignore:
    - '.github/**'
    - 'REUSE.toml'
    - 'LICENSES/*.txt'
    - 'hack/**'
    - 'docs/**'
    - 'LICENSE'
    - '**/*.gitignore'
    - '**/*.tpl'
    - '**/*.alerts'
    - '**/go.mod'
    - '**/go.sum'
    - '**/*.lock'
    - '**/*.json'
    - '**/.gitkeep'
    - '**/*.txt'
    - '*Dockerfile*'
    - 'Makefile'
    - '.mockery.yaml'     # Mockery config file
    - 'internal/mocks/**'    # Mockery generated files
    - 'pkg/mocks/**'    # Mockery generated files

  comment: on-failure
  
  # license-location-threshold specifies the index threshold where the license header can be located,
  # after all, a "header" cannot be TOO far from the file start.
  license-location-threshold: 80

  language:
    JSX:
      extensions:
        - ".jsx"
      comment_style_id: SlashAsterisk
