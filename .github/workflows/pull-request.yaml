name: PR Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    env:
      IMG: greenhouse-mcp:pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: make docker-build

  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin Go to a version no newer than the one golangci-lint v2.13.2 was
      # built with (go1.27.0). A newer Go emits export data the linter cannot
      # decode, which surfaces as spurious typecheck errors.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Golang Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=15m
          only-new-issues: true
          skip-cache: false

  checksOK:
    name: "status checks passed"
    needs: [build, test, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Check if all checks passed"
        run: |
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.lint.result }}" == "success" ]; then
            echo "✅ All checks passed 🎉"
            exit 0
          else
            echo "❌ Some checks failed 😭"
            exit 1
          fi
